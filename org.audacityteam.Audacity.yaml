app-id: org.audacityteam.Audacity
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: audacity
rename-icon: audacity
finish-args:
  - --share=ipc
  - --share=network
  # Audacity 4 forces QT_QPA_PLATFORM=xcb (src/app/main.cpp), so X11 is required
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  # Projects are SQLite databases: SQLite needs real directory access (journal/temp files next to
  # the .aup4), which the document portal cannot provide
  - --filesystem=home
  # JACK support via pipewire (portaudio is built with JACK, libjack/libpipewire are linked)
  - --filesystem=xdg-run/pipewire-0:ro

add-extensions:
  org.freedesktop.LinuxAudio.Plugins:
    directory: extensions/Plugins
    version: '25.08'
    add-ld-path: lib
    merge-dirs: ladspa;lv2;vst;vst3
    subdirectories: true
    no-autodownload: true

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - '*.la'
  - '*.a'

modules:
  # Needed by Audacity's bundled-dependency build (muse_deps) to relocate ELF files
  - name: patchelf
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://github.com/NixOS/patchelf/releases/download/0.18.0/patchelf-0.18.0.tar.bz2
        sha256: 1952b2a782ba576279c211ee942e341748fdb44997f704dd53def46cd055470b

  - name: audacity
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      # bundled wxWidgets zlib (C89-style code) fails with GCC >= 14 otherwise
      cflags: -Wno-error=implicit-function-declaration
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DAU4_BUILD_CONFIGURATION=app
      - -DAU4_BUILD_MODE=release
      - -DMUSE_ENABLE_UNIT_TESTS=OFF
      - -DMUSE_MODULE_DIAGNOSTICS_CRASHPAD_CLIENT=OFF
      # Dependency sources are bundled in the release tarball; no network at build time
      - -DEXTDEPS_CACHE=/run/build/audacity/offline-deps
    post-install:
      # Fix-ups for the upstream AppImage-oriented desktop file / metainfo
      - desktop-file-edit --set-key=Name --set-value=Audacity --set-key=Exec --set-value="audacity %F" /app/share/applications/org.audacityteam.Audacity.desktop
      - sed -i 's|>audacity.desktop<|>org.audacityteam.Audacity.desktop<|' /app/share/metainfo/org.audacityteam.Audacity.appdata.xml
      # Flathub requires a screenshot; upstream ships none
      - sed -i '/<url type="homepage">/i\  <screenshots><screenshot type="default"><image>https://github.com/flathub/org.audacityteam.Audacity/raw/95ac50436bfcbbcd032b406544ff806c206d8333/screenshots/main-window.png</image><caption>Main Window</caption></screenshot></screenshots>' /app/share/metainfo/org.audacityteam.Audacity.appdata.xml
      - mv /app/bin/audacity /app/bin/audacity.bin
      - install -Dm755 ../audacity.sh /app/bin/audacity
      - install -d /app/extensions/Plugins
    sources:
      - type: archive
        url: https://github.com/audacity/audacity/releases/download/Audacity-4.0.2/audacity-sources-4.0.2.tar.xz
        sha256: 4799c2ce2deabacf2be8d6d6b3c5a5621bcd3aacf7c1c38bd0a3f2598f1034c0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/audacity/audacity/releases/latest
          version-query: .tag_name | sub("^Audacity-"; "")
          url-query: .assets[] | select(.name=="audacity-sources-" + $version + ".tar.xz") | .browser_download_url
      - type: patch
        path: patches/0001-extdeps-install-libs-to-lib.patch
      - type: script
        dest-filename: audacity.sh
        commands:
          - export LADSPA_PATH=/app/extensions/Plugins/ladspa
          - export VST3_PATH=/app/extensions/Plugins/vst3
          - export LV2_PATH=$HOME/.lv2:/app/extensions/Plugins/lv2:/app/lib/lv2
          - exec audacity.bin "$@"
